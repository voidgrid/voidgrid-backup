{{define "status"}}{{template "top" .}}
  <div id="status">
    <h2>Status <span class="{{.Level}}">{{.Summary}}</span></h2>
    <div class="card status">
      <table>
        <tbody>
        {{range .Lines}}
          <tr><td class="muted">{{.Label}}</td><td><a class="{{.Level}}" href="{{.Href}}">{{.Text}}</a>{{if .Ack}} <form class="inline" method="post" action="{{.Ack}}"><input type="hidden" name="back" value="/"><button class="plain" type="submit">Acknowledge</button></form>{{end}}</td></tr>
        {{end}}
        </tbody>
      </table>
    </div>
  </div>
  <div id="live" data-ids="status" data-every="20000" hidden></div>
{{template "bottom" .}}{{end}}
