syntax = "proto3";

package voidgridbackup.registry.v1;

option go_package = "github.com/voidgrid/voidgrid-backup/internal/proto/agentpb";

// Registry is served by the voidgrid-backup server on its registration
// listener. Agents call it; the server never dials it.
//
// TLS: the server presents a self-signed certificate that the registration
// token pins, and the agent presents its own self-signed certificate as the
// client certificate. The server identifies an agent by that certificate, so
// no agent identity travels in the messages.
service Registry {
  // Register announces the agent. A valid token only creates a pending
  // registration; an operator still has to approve it. Calling it again
  // returns the same registration.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Poll asks for the operator's decision.
  rpc Poll(PollRequest) returns (PollResponse);
}

message RegisterRequest {
  // The token's secret.
  bytes secret = 1;
  // What the agent calls itself (a name suggestion for the operator).
  string hostname = 2;
  string version = 3;
  // Port the agent listens on for the server's connections.
  int32 listen_port = 4;
}

message RegisterResponse {
  string registration_id = 1;
}

message PollRequest {}

enum RegistrationStatus {
  REGISTRATION_STATUS_UNSPECIFIED = 0;
  REGISTRATION_STATUS_PENDING = 1;
  REGISTRATION_STATUS_APPROVED = 2;
  REGISTRATION_STATUS_REJECTED = 3;
}

message PollResponse {
  RegistrationStatus status = 1;
  // Set when approved: the agent's ID, the certificate the server issued for
  // the agent's key, and the CA the agent should require from the server.
  string agent_id = 2;
  bytes cert_der = 3;
  bytes ca_der = 4;
}
