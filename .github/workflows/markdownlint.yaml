name: markdownlint

# Lints the repo's markdown with the pinned markdownlint-cli2 (scripts/lint-md.sh, rules in
# .markdownlint-cli2.jsonc), the same check as the pre-commit hook.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: markdownlint
        run: scripts/lint-md.sh
